name: Dependency Diff

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-main:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main # or your default branch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.upm/store
          key: v1-upm-${{ hashFiles('**/upm.lock') }}
          restore-keys: |
            v1-upm-
      - name: Install dependencies
        run: upm install --frozen-lockfile

      - name: Build
        run: node --run build
      - name: Pack
        run: pnpm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-packages
          path: "*.tgz"

  build-pr:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.upm/store
          key: v1-upm-${{ hashFiles('**/upm.lock') }}
          restore-keys: |
            v1-upm-
      - name: Install dependencies
        run: upm install --frozen-lockfile

      - name: Build
        run: node --run build
      - name: Pack
        run: pnpm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-packages
          path: "*.tgz"

  diff_dependencies:
    runs-on: ubuntu-24.04-arm
    needs: [build-main, build-pr]
    permissions:
      pull-requests: write # to comment on pr

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # allows the diff action to access git history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-packages
          path: ./base-packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-packages
          path: ./source-packages
      - name: Create Diff
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77 # v1.7.1
        with:
          base-packages: ./base-packages/*.tgz
          source-packages: ./source-packages/*.tgz
          duplicate-threshold: 2
          pack-size-threshold: 500
          size-threshold: 500
